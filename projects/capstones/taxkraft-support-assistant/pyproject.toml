[project]
name = "taxkraft-support-assistant"
version = "0.1.0"
description = "TaxKraft company-specific guardrailed RAG support chatbot (production capstone)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "sentence-transformers>=5.0",
    "chromadb>=1.5.9",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "openai>=1.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"