name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest on Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --no-progress

      - name: Lint and format check
        run: |
          uv run ruff check src tests scripts conftest.py
          uv run ruff format --check src tests scripts conftest.py

      - name: Verify no notebook has error outputs
        run: uv run python scripts/verify_notebooks.py

      - name: Run tests
        run: uv run pytest -q