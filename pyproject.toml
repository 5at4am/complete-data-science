[project]
name = "complete-ml"
version = "0.1.0"
description = "AI/ML Engineering Learning System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core numerical / data
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.0",
    # Deep learning
    "torch>=2.0",
    "accelerate>=1.14.0",
    # Hugging Face
    "transformers>=5.16.1",
    "datasets>=5.0.1",
    "tokenizers>=0.23.1",
    "sentence-transformers>=6.0.0",
    # Vector search
    "chromadb>=1.5.9",
    # LLM / Agents
    "openai>=1.0",
    "langchain>=0.1",
    "langchain-openai>=1.6.0",
    "langchain-groq>=1.0.0",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.11",
    "tiktoken>=0.14.0",
    # Gradient boosting
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    # Hyperparameter optimization & interpretability
    "optuna>=3.0",
    "shap>=0.44",
    # Web / API
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "flask>=3.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    # Documents
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    # Config / Validation
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    # Notebooks
    "jupyterlab>=4.6.3",
    "notebook>=7.6.2",
    "nbconvert>=7.17.1",
    "ipykernel>=6.0",
    # Datasets
    "kagglehub>=1.0.2",
    "opendatasets>=0.1.22",
    # Testing
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]  # sys.path bootstrap before imports
"scripts/*" = ["E402"]    # CLI imports after argparse bootstrap as needed
